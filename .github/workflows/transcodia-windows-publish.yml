name: Transcodia Windows publish

on:
  push:
    branches: [release, transcodia-release, transcodia-windows]
  workflow_dispatch:

concurrency:
  group: transcodia-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: vars.ENABLE_DESKTOP_RELEASES == 'true'
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (python scripts/bump_version.py --print).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
          $ffmpeg = Get-ChildItem -LiteralPath "$env:ChocolateyInstall/lib/ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "FFmpeg payload was not found" }
          "VERIFY_FFMPEG=$($ffmpeg.FullName)" >> $env:GITHUB_ENV

      - name: Build bundle
        shell: pwsh
        run: ./scripts/windows_build.ps1 -VerifyFfmpegPath $env:VERIFY_FFMPEG

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: transcodia-windows-x64
          path: dist/Transcodia-${{ steps.version.outputs.version }}-windows-x64.zip

      - name: Publish to draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: transcodia-v${{ steps.version.outputs.version }}
          name: Transcodia ${{ steps.version.outputs.version }}
          draft: true
          files: dist/Transcodia-${{ steps.version.outputs.version }}-windows-x64.zip
