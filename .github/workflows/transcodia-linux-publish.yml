name: Transcodia Linux publish

on:
  push:
    branches: [release, transcodia-release, transcodia-linux]
  workflow_dispatch:

concurrency:
  group: transcodia-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: vars.ENABLE_DESKTOP_RELEASES == 'true'
    name: Build Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Read version
        id: version
        run: echo "version=$(python3 scripts/bump_version.py --print)" >> "$GITHUB_OUTPUT"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 fonts-dejavu-core
          echo "VERIFY_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"

      - name: Build bundle
        run: bash scripts/unix_build.sh "$VERIFY_FFMPEG"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: transcodia-linux-x86_64
          path: dist/Transcodia-${{ steps.version.outputs.version }}-linux-*.tar.gz

      - name: Publish to draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: transcodia-v${{ steps.version.outputs.version }}
          name: Transcodia ${{ steps.version.outputs.version }}
          draft: true
          files: dist/Transcodia-${{ steps.version.outputs.version }}-linux-*.tar.gz
